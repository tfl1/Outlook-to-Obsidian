<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outlook to Obsidian</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { --accent: #7c3aed; --accent-soft: #f1ebfd; --border: #d6d6d6; --muted: #666; --err: #b00020; --ok: #0a6b2d; }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; margin: 0; padding: 12px; color: #1f1f1f; background: #fff; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
    h2.first { margin-top: 0; }
    #noteName { font-weight: 600; font-size: 14px; }
    #meta { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
    input[type=text], input[type=password] { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font: inherit; }
    input[type=text]:focus, input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row input { flex: 1; }
    #folders { border: 1px solid var(--border); border-radius: 4px; margin-top: 6px; max-height: 220px; overflow-y: auto; }
    .group { font-size: 11px; color: var(--muted); padding: 4px 8px; background: #fafafa; border-bottom: 1px solid #eee; position: sticky; top: 0; }
    .folder { padding: 4px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid #f3f3f3; }
    .folder:hover { background: #f5f5f5; }
    .folder.sel { background: var(--accent-soft); font-weight: 600; }
    .folder .parent { color: var(--muted); }
    .empty { padding: 8px; color: var(--muted); }
    #chosen { margin-top: 6px; font-size: 12px; }
    #chosen b { color: var(--accent); word-break: break-word; }
    label.check { display: flex; gap: 6px; align-items: center; margin: 6px 0; cursor: pointer; }
    button { font: inherit; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
    button:hover:not(:disabled) { background: #f5f5f5; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; width: 100%; padding: 8px; margin-top: 10px; }
    button.primary:hover:not(:disabled) { background: #6d28d9; }
    button:disabled { opacity: .5; cursor: default; }
    button.icon { padding: 5px 9px; }
    #status { margin-top: 10px; padding: 8px; border-radius: 4px; display: none; white-space: pre-wrap; word-break: break-word; }
    #status.ok { display: block; background: #e8f5ec; color: var(--ok); }
    #status.err { display: block; background: #fdecee; color: var(--err); }
    #status.busy { display: block; background: #f5f5f5; color: #333; }
    details { margin-top: 16px; border-top: 1px solid #eee; padding-top: 8px; }
    summary { cursor: pointer; color: var(--muted); font-weight: 600; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0; }
    #namePreview { word-break: break-word; }
  </style>
</head>
<body>
  <h2 class="first">Note name</h2>
  <input id="noteName" type="text" autocomplete="off" spellcheck="true" placeholder="Select an email…">
  <div id="namePreview" class="hint"></div>
  <div id="meta"></div>

  <h2>Save to folder</h2>
  <div class="row">
    <input id="filter" type="text" placeholder="Type to filter folders" autocomplete="off">
    <button id="refresh" class="icon" title="Reload folder list">↻</button>
  </div>
  <div id="folders"><div class="empty">Loading folders…</div></div>
  <div id="chosen">No folder selected.</div>

  <h2>Tags</h2>
  <input id="tags" type="text" placeholder="e.g. budget, fy27" autocomplete="off">

  <label class="check"><input id="keepRemote" type="checkbox"> Keep remote images</label>

  <button id="save" class="primary" disabled>Save to Obsidian</button>
  <div id="status"></div>

  <details id="settings">
    <summary>Settings</summary>
    <h2>Local REST API key</h2>
    <div class="row">
      <input id="apikey" type="password" autocomplete="off" placeholder="Paste key from Obsidian settings">
      <button id="saveKey">Save</button>
    </div>
    <h2>Defaults</h2>
    <label class="check"><input id="defKeepRemote" type="checkbox"> Keep remote images by default</label>
    <label class="check"><input id="defOpenAfter" type="checkbox"> Open the note in Obsidian after saving</label>
    <p class="hint">Default changes are saved immediately.</p>
  </details>

  <!-- Bump ?v= with every release so Outlook can't pair new HTML with a cached old script. -->
  <script type="module" src="taskpane.js?v=1.2"></script>
</body>
</html>
